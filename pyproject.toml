[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inmobil-iaria"
version = "0.1.0"
description = "Pipeline de captacion, valoracion y notificacion inmobiliaria"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4==4.12.3",
    "joblib==1.4.2",
    "lxml==5.3.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "rich==13.9.4",
    "scikit-learn==1.5.2",
    "scipy==1.13.1",
    "selenium==4.25.0",
    "undetected-chromedriver==3.5.5",
]

[project.optional-dependencies]
notebooks = [
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tabulate==0.9.0",
]
dev = ["pytest==8.3.3"]

[project.scripts]
inmobil-iaria = "inmobil_iaria.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
