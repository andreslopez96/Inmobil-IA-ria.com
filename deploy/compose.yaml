services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data/raw:/app/data/raw
      - ../data/processed:/app/data/processed
      - ../data/private:/app/data/private:ro
      - ../models:/app/models:ro
      - ../artifacts:/app/artifacts
      - ../.runtime:/app/.runtime
    command: ["python", "-m", "inmobil_iaria", "doctor"]
